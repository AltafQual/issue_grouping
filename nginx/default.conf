map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    client_max_body_size 50m;
    proxy_read_timeout 1000;
    proxy_send_timeout 1000;
    proxy_http_version 1.1;

    # FastAPI Swagger UI is mounted at exactly `/api` (no trailing slash) by
    # docs_url="/api" in api.py — match it explicitly so it doesn't fall
    # through to the streamlit `/` location below.
    location = /api {
        proxy_pass http://fastapi:8010/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # OpenAPI spec — Swagger UI fetches this by default. Without this route
    # nginx falls through to streamlit and Swagger fails with "no valid
    # version field".
    location = /openapi.json {
        proxy_pass http://fastapi:8010/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI endpoints — everything under /api/...
    location /api/ {
        proxy_pass http://fastapi:8010/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Streamlit websocket — must come before the catch-all `/` block
    location /_stcore/stream {
        proxy_pass http://streamlit:8501/_stcore/stream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Streamlit UI
    location / {
        proxy_pass http://streamlit:8501;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
